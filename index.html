<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var enc = new TextEncoder(), dec = new TextDecoder();
  var b64d = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var b64e = function (u) {
    var a = new Uint8Array(u), s = '', i;
    for (i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
    return btoa(s);
  };
  var BUILT = JSON.parse($('vault').textContent);
  var LS = 'dv_' + BUILT.appIv.replace(/[^A-Za-z0-9]/g, '').slice(0, 12);
  var FL = LS + '_fail', LD = LS + '_data';
  var VAULT_RE = /(<script id="vault" type="application\/json">)[\s\S]*?(<\/script>)/;
  var DATA_RE = /(<script id="savedData" type="application\/json">)[\s\S]*?(<\/script>)/;

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // Logins changed inside this browser are kept locally until a new file is published.
  function currentUsers() {
    if (BUILT.locked) return BUILT.users;
    try {
      var o = JSON.parse(load(LS) || 'null');
      if (o && o.users && o.users.manager && o.users.viewer) return o.users;
    } catch (e) {}
    return BUILT.users;
  }
  async function derive(user, pass, saltB64) {
    var base = await crypto.subtle.importKey('raw', enc.encode(user.trim().toLowerCase() + '\u0000' + pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(saltB64), iterations: BUILT.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function unwrap(user, pass, ent) {
    try {
      var k = await derive(user, pass, ent.salt);
      return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(ent.iv) }, k, b64d(ent.wrapped)));
    } catch (e) { return null; }
  }
  async function wrapFor(user, pass, dek) {
    var ent = { salt: b64e(crypto.getRandomValues(new Uint8Array(16))), iv: b64e(crypto.getRandomValues(new Uint8Array(12))) };
    var k = await derive(user, pass, ent.salt);
    ent.wrapped = b64e(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: b64d(ent.iv) }, k, dek));
    return ent;
  }

  function failState() { try { return JSON.parse(load(FL) || '{"n":0,"until":0}'); } catch (e) { return { n: 0, until: 0 }; } }
  function registerFail() {
    var f = failState(); f.n++;
    if (f.n >= 5) f.until = Date.now() + Math.min(600, 10 * Math.pow(2, f.n - 5)) * 1000;
    store(FL, JSON.stringify(f));
  }

  function installApi(dek, role, appHtml, shellHtml) {
    var users = currentUsers();
    var api = {
      role: role,
      lock: function () { location.reload(); },
      onReady: function () {
        var t, reset = function () { clearTimeout(t); t = setTimeout(function () { location.reload(); }, 15 * 60 * 1000); };
        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (e) { document.addEventListener(e, reset, { passive: true }); });
        reset();
      }
    };

    // Everything below is available to the manager only. A regular user's session never receives these functions.
    if (role === 'manager') {
      var persistUsers = function () { store(LS, JSON.stringify({ users: users })); };
      var checkNew = function (u, p) {
        if (u.trim().length < 3) return 'Username must be at least 3 characters.';
        if (p.length < 6) return 'Password must be at least 6 characters.';
        return null;
      };
      api.change = async function (cu, cp, nu, np) {
        if (!(await unwrap(cu, cp, users.manager))) return { ok: false, error: 'Current manager username or password is incorrect.' };
        var bad = checkNew(nu, np); if (bad) return { ok: false, error: bad };
        if (await unwrap(nu, np, users.viewer)) return { ok: false, error: 'The new manager login must differ from the viewer login.' };
        users = { manager: await wrapFor(nu, np, dek), viewer: users.viewer };
        persistUsers();
        return { ok: true };
      };
      api.setViewer = async function (vu, vp) {
        var bad = checkNew(vu, vp); if (bad) return { ok: false, error: bad };
        if (await unwrap(vu, vp, users.manager)) return { ok: false, error: 'The viewer login must differ from the manager login.' };
        users = { manager: users.manager, viewer: await wrapFor(vu, vp, dek) };
        persistUsers();
        return { ok: true };
      };
      api.saveLocal = function (s) { store(LD, s); };
      api.loadLocal = function () { return load(LD); };
      // Builds a new protected file: data + both logins baked in, re-encrypted with a fresh IV.
      api.publish = async function (dataJson) {
        try {
          var app = appHtml;
          if (dataJson != null) {
            var safe = dataJson.replace(/</g, '\\u003c');
            app = app.replace(DATA_RE, function (m, a, b) { return a + safe + b; });
          }
          var iv = crypto.getRandomValues(new Uint8Array(12));
          var key = await crypto.subtle.importKey('raw', dek, 'AES-GCM', false, ['encrypt']);
          var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(app));
          var v = { v: 2, iter: BUILT.iter, users: users, appIv: b64e(iv), appCt: b64e(ct) };
          var json = JSON.stringify(v);
          appHtml = app;
          return { ok: true, html: shellHtml.replace(VAULT_RE, function (m, a, b) { return a + json + b; }) };
        } catch (e) { return { ok: false, error: 'Could not build the published file.' }; }
      };

      // LOCKED export for regular users: brand-new random key, wrapped ONLY for the viewer login.
      // The manager login, the manager key and every edit/publish function are not in the file at all,
      // so nobody (including the manager password) can open it in manager mode or edit/re-publish it.
      api.publishLocked = async function (dataJson, vu, vp) {
        try {
          var bad = checkNew(vu, vp); if (bad) return { ok: false, error: bad };
          if (await unwrap(vu, vp, users.manager)) return { ok: false, error: 'The viewer login must differ from the manager login.' };
          var app = appHtml;
          if (dataJson != null) {
            var safe = dataJson.replace(/</g, '\\u003c');
            app = app.replace(DATA_RE, function (m, a, b) { return a + safe + b; });
          }
          var newDek = crypto.getRandomValues(new Uint8Array(32));
          var iv = crypto.getRandomValues(new Uint8Array(12));
          var key = await crypto.subtle.importKey('raw', newDek, 'AES-GCM', false, ['encrypt']);
          var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(app));
          var v = { v: 2, iter: BUILT.iter, locked: true, users: { viewer: await wrapFor(vu, vp, newDek) }, appIv: b64e(iv), appCt: b64e(ct) };
          var json = JSON.stringify(v);
          return { ok: true, html: shellHtml.replace(VAULT_RE, function (m, a, b) { return a + json + b; }) };
        } catch (e) { return { ok: false, error: 'Could not build the locked file.' }; }
      };
    }
    window.__vault = api;
  }

  async function unlock() {
    var err = $('err'), go = $('go');
